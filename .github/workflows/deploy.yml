name: Deploy Worker

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply riding-lion --remote
          packageManager: npm

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEDIA_SIGNING_SECRET: ${{ secrets.MEDIA_SIGNING_SECRET }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${2:-}"
            if [[ -z "$value" ]]; then
              echo "skip empty secret: $name"
              return 0
            fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          }
          put_secret MEDIA_SIGNING_SECRET "$MEDIA_SIGNING_SECRET"
          put_secret FAL_KEY "$FAL_KEY"
          put_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_secret RESEND_WEBHOOK_SECRET "$RESEND_WEBHOOK_SECRET"
          put_secret APP_BASE_URL "$APP_BASE_URL"

      - name: Seed R2 template assets
        if: vars.SEED_R2_ON_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x scripts/seed-remote-assets.sh scripts/seed-local-assets.sh
          bash scripts/seed-remote-assets.sh
